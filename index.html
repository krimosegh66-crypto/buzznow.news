// ── LANGUAGE DETECTION ──
async function detectLanguage(){
  const browserLang=(navigator.language||navigator.languages?.[0]||'en').split('-')[0];
  if(I18N[browserLang]){return browserLang}
  try{
    const r=await fetch('https://ipapi.co/json/');
    const d=await r.json();
    if(d.country_code&&IP_LANG[d.country_code])return IP_LANG[d.country_code];
  }catch(e){}
  return 'en';
}

// ── LOCATION DETECTION ──
async function detectLocation(){
  const apis=[
    ()=>fetch('https://ipapi.co/json/').then(r=>r.ok?r.json():null),
    ()=>fetch('https://ipwho.is/').then(r=>r.ok?r.json():null),
    ()=>fetch('https://ipinfo.io/json').then(r=>r.ok?r.json():null)
  ];
  const results=await Promise.allSettled(apis.map(fn=>fn().catch(()=>null)));
  for(const r of results){
    if(r.status==='fulfilled'&&r.value){
      const d=r.value;
      const cc=d.country_code||d.country_code;
      const cn=d.country_name||d.country;
      const city=d.city||d.region;
      if(cc&&cc.length===2){
        state.userCountry=cc;
        state.userCountryName=cn||cc;
        if(d.latitude)state.userLat=d.latitude;
        if(d.longitude)state.userLon=d.longitude;
        return{countryCode:cc,countryName:cn,city:city,lat:d.latitude,lon:d.longitude};
      }
    }
  }
  return null;
}

// ── APPLY LOCALIZATION ──
function applyLocalization(lang){
  if(!I18N[lang])lang='en';
  state.lang=lang;
  localStorage.setItem('buzznow_lang',lang);
  const t=I18N[lang];
  const h=document.documentElement;
  h.setAttribute('lang',lang);
  h.setAttribute('dir',t.dir);
  h.setAttribute('data-lang',lang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n;
    if(t[k])el.textContent=t[k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k=el.dataset.i18nPh;
    if(t[k])el.placeholder=t[k];
  });
  document.getElementById('langToggle').textContent=t.label;
  document.title=lang==='ar'?'باز نيو — ما يحدث حول العالم':'BuzzNow — What\'s Happening Around the World';
  buildDesktopNav();buildCategoryTabs();buildMobileNav();buildMobileBottomNav();buildFooterLinks();buildLangMenu();
  if(state.filtered.length)renderNewsGrid();
  renderHero();renderLocalNews();renderTicker();
}

// ── TIME AGO ──
function timeAgo(iso){
  if(!iso)return '';
  const date=new Date(iso);
  if(isNaN(date))return '';
  const diff=(Date.now()-date.getTime())/1000;
  const t=I18N[state.lang];
  if(diff<60)return t.justNow;
  if(diff<3600)return Math.floor(diff/60)+t.m;
  if(diff<86400)return Math.floor(diff/3600)+t.h;
  return Math.floor(diff/86400)+t.d;
}

  return '<article class="surface border border-subtle fin" style="border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation-delay:'+(i%6*60)+'ms" onmouseover="this.style.transform=\'translateY(-4px)\';this.style.boxShadow=\'0 12px 32px rgba(99,102,241,.18)\'" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\'">'+
    '<a href="'+(a.url||'#')+'" target="_blank" rel="noopener" style="display:block;overflow:hidden">'+
      '<div style="position:relative">'+
        '<img loading="lazy" src="'+img+'" alt="'+title+'" style="width:100%;height:170px;object-fit:cover;transition:transform .3s" onerror="this.onerror=null;this.src=\''+PLACEHOLDER_IMGS[(i+13)%PLACEHOLDER_IMGS.length]+'\'">'+
        '<span style="position:absolute;top:10px;'+(state.lang==='ar'?'right':'left')+':10px;background:'+col+';color:white;font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px">'+catLabel+'</span>'+
      '</div>'+
    '</a>'+
    '<div style="padding:1rem;display:flex;flex-direction:column;gap:.5rem;flex:1">'+
      '<div style="display:flex;align-items:center;gap:.5rem;font-size:.7rem" class="text-tertiary">'+
        '<span style="font-weight:700;color:'+col+'">'+source+'</span>'+
        '<span>·</span><span>'+timeAgo(a.pubDate)+'</span>'+
      '</div>'+
      '<h3 class="line-clamp-2 text-primary" style="font-size:.92rem;font-weight:700;line-height:1.4"><a href="'+(a.url||'#')+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">'+title+'</a></h3>'+
      '<p class="line-clamp-2 text-secondary" style="font-size:.8rem;flex:1">'+(a.desc||'')+'</p>'+
      '<a href="'+(a.url||'#')+'" target="_blank" rel="noopener" style="color:'+col+';font-size:.75rem;font-weight:600;text-decoration:none">'+t.readMore+' →</a>'+
    '</div>'+
  '</article>';
}

// ── RENDER NEWS GRID ──
function renderNewsGrid(){
  const grid=document.getElementById('newsGrid');
  const btn=document.getElementById('loadMoreWrap');
  const list=state.searchText?state.searchAll:state.filtered;
  const shown=list.slice(0,state.page*PAGE_SIZE);
  const t=I18N[state.lang];
  if(!shown.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem 0" class="text-secondary">'+t.noResults+'</div>';
    if(btn)btn.style.display='none';
    return;
  }
  grid.innerHTML=shown.map((a,i)=>cardHTML(a,i)).join('');
  if(btn)btn.style.display=shown.length>=list.length?'none':'block';
  document.getElementById('loadMoreBtn').textContent=t.loadMore;
}
function loadMore(){
  state.page++;
  renderNewsGrid();
  document.getElementById('loadMoreBtn').scrollIntoView({behavior:'smooth',block:'center'});
}

// ── RENDER HERO ──
function renderHero(){
  const grid=document.getElementById('heroGrid');
  const news=state.searchText?state.searchAll:state.filtered;
  if(!news.length){grid.innerHTML='';return}
  const main=news[0];
  const side=news.slice(1,3);
  const t=I18N[state.lang];
  const img=main.en||PLACEHOLDER_IMGS[0];
  grid.innerHTML=
    '<a href="'+(main.url||'#')+'" target="_blank" rel="noopener" class="surface border border-subtle" style="position:relative;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;min-height:300px;text-decoration:none" onmouseover="this.querySelector(\'img\').style.transform=\'scale(1.05)\'" onmouseout="this.querySelector(\'img\').style.transform=\'\'">'+
      '<img src="'+img+'" alt="'+main.title+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s">'+
      '<div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(2,6,23,.9),rgba(2,6,23,.1))"></div>'+
      '<div style="position:relative;padding:1.5rem;z-index:2">'+
        '<span style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-size:.65rem;font-weight:700;padding:4px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px">'+t.news+'</span>'+
        '<h2 class="line-clamp-2" style="color:white;font-family:\'Playfair Display\',Georgia,serif;font-size:1.5rem;font-weight:800;margin:.6rem 0;line-height:1.3">'+main.title+'</h2>'+
        '<div style="color:#cbd5e1;font-size:.75rem">'+main.source+' · '+timeAgo(main.pubDate)+'</div>'+
      '</div>'+
    '</a>'+
    '<div style="display:flex;flex-direction:column;gap:1rem">'+
      side.map(function(s,j){
        const simg=s.en||PLACEHOLDER_IMGS[(j+2)%PLACEHOLDER_IMGS.length];
        return '<a href="'+(s.url||'#')+'" target="_blank" rel="noopener" class="surface border border-subtle" style="border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex:1" onmouseover="this.style.boxShadow=\'0 8px 24px rgba(99,102,241,.15)\'" onmouseout="this.style.boxShadow=\'\'">'+
          '<img loading="lazy" src="'+simg+'" alt="'+s.title+'" style="width:110px;height:100%;min-height:110px;object-fit:cover" onerror="this.src=\''+PLACEHOLDER_IMGS[(j+22)%PLACEHOLDER_IMGS.length]+'\'">'+
          '<div style="padding:.75rem;display:flex;flex-direction:column;justify-content:center;gap:.25rem">'+
            '<span style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:'+(CAT_COLORS[s.c]||'#6366f1')+'">'+s.source+'</span>'+
            '<span class="line-clamp-2 text-primary" style="font-size:.8rem;font-weight:600;line-height:1.35">'+s.title+'</span>'+
          '</div>'+
        '</a>';
      }).join('')+
    '</div>';
}

// ── RENDER TICKER ──
function renderTicker(){
  const list=state.searchText?state.searchAll:state.filtered;
  if(!list.length)return;
  const inn=document.getElementById('tickerInner');
  const items=list.slice(0,10).map(function(a){
    return '<span style="display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem" class="text-secondary"><span style="width:6px;height:6px;border-radius:50%;background:#6366f1;flex-shrink:0"></span><a href="'+(a.url||'#')+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">'+a.title+'</a></span>';
  }).join('');
  inn.innerHTML=items+items;
}

// ── RENDER LOCAL NEWS ──
function renderLocalNews(){
  const el=document.getElementById('localList');
  const list=state.searchText?state.searchAll:state.filtered;
  const local=list.length?list:state.articles;
  if(!local.length){el.innerHTML='';return}
  el.innerHTML=local.slice(0,10).map(function(a,i){
    return '<a href="'+(a.url||'#')+'" target="_blank" rel="noopener" style="display:flex;gap:.75rem;padding:.75rem 1rem;text-decoration:none;border-bottom:1px solid var(--border-subtle,rgba(255,255,255,.06));align-items:flex-start" class="hover-surface">'+
      '<img loading="lazy" src="'+(a.en||PLACEHOLDER_IMGS[(i+31)%PLACEHOLDER_IMGS.length])+'" alt="" style="width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0" onerror="this.style.display=\'none\'">'+
      '<div style="flex:1;min-width:0">'+
        '<div class="line-clamp-2 text-primary" style="font-size:.8rem;font-weight:600;line-height:1.35">'+a.title+'</div>'+
        '<div style="display:flex;align-items:center;gap:.4rem;margin-top:.3rem;font-size:.65rem" class="text-tertiary"><span style="font-weight:700">'+a.source+'</span><span>·</span><span>'+timeAgo(a.pubDate)+'</span></div>'+
      '</div>'+
    '</a>';
  }).join('');
}

// ── VISITOR COUNTER ──
function initVisitorCounter(){
  let count=parseInt(localStorage.getItem('buzznow_views')||'0');
  count=count?count:(Math.floor(Math.random()*500000)+100000);
  count++;
  count+=Math.floor(Math.random()*7);
  localStorage.setItem('buzznow_views',count);
  const el=document.getElementById('visitorCount');
  if(el)el.textContent=count.toLocaleString(state.lang==='ar'?'ar-EG':state.lang||'en');
}

// ── FOOTER TIME ──
function updateFooterTime(){
  const el=document.getElementById('footerTime');
  if(el){
    const now=new Date();
    el.textContent=now.toLocaleTimeString(state.lang==='ar'?'ar-EG':state.lang||'en',{hour:'2-digit',minute:'2-digit'});
  }
}

// ── BACK TO TOP ──
function initBackToTop(){
  const btn=document.getElementById('backToTop');
  window.addEventListener('scroll',function(){
    const show=window.scrollY>600;
    btn.style.opacity=show?'1':'0';
    btn.style.visibility=show?'visible':'hidden';
    btn.style.transform=show?'translateY(0)':'translateY(16px)';
  },{passive:true});
}

// ── WEATHER ──
async function fetchWeatherData(){
  const el=document.getElementById('weatherWidget');
  const t=I18N[state.lang];
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+state.userLat+'&longitude='+state.userLon+'&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3';
    const r=await fetch(url);
    const d=await r.json();
    if(!d||!d.current_weather)throw 0;
    const cur=d.current_weather;
    const days=d.daily;
    const codes={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',61:'🌧',63:'🌧',65:'🌧',71:'🌨',80:'🌧',95:'⛈'};
    let html='<div style="text-align:center;margin-bottom:1rem">'+
      '<div style="font-size:2.5rem">'+(codes[cur.weathercode]||'🌡')+'</div>'+
      '<div class="text-primary" style="font-weight:800;font-size:1.3rem">'+Math.round(cur.temperature)+'°C</div>'+
      '<div class="text-tertiary" style="font-size:.75rem">'+state.userCountryName+'</div>'+
    '</div>';
    html+='<div style="display:flex;gap:.5rem;border-top:1px solid var(--border-subtle,rgba(255,255,255,.08));padding-top:.75rem">'+
      Array.from({length:3},function(_,i){
        const day=new Date(Date.now()+i*86400000);
        const wd=day.toLocaleDateString(state.lang==='ar'?'ar-EG':state.lang||'en',{weekday:'short'});
        return '<div style="flex:1;text-align:center;font-size:.65rem" class="text-tertiary"><div>'+wd+'</div><div style="font-size:1.1rem;margin:.2rem 0">'+(codes[days.weathercode[i]]||'🌡')+'</div><div class="text-primary" style="font-weight:600">'+Math.round(days.temperature_2m_max[i])+'°</div></div>';
      }).join('')+
    '</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div style="text-align:center;font-size:.75rem" class="text-tertiary">'+(state.lang==='ar'?'الطقس غير متاح':'Weather unavailable')+'</div>';
  }
}
async function loadWeather(){
  const el=document.getElementById('weatherWidget');
  let tries=0;
  const loop=setInterval(function(){
    tries++;
    if(state.userLat&&state.userLon){clearInterval(loop);fetchWeatherData();}
    else if(tries>=8){clearInterval(loop);el.innerHTML='<div style="text-align:center;font-size:.75rem" class="text-tertiary">'+(state.lang==='ar'?'غير متاح':'Unavailable')+'</div>';}
  },1000);
}

// ── LOAD NEWS ──
async function loadNews(){
  const grid=document.getElementById('newsGrid');
  grid.innerHTML=Array.from({length:9},function(){return '<div class="skeleton" style="height:280px;border-radius:14px"></div>';}).join('');
  const batch=Math.min(FEEDS.length,12);
  const batchFeeds=FEEDS.slice(0,batch);
  const results=await Promise.allSettled(batchFeeds.map(function(f){
    return fetch(RSS2JSON+encodeURIComponent(f.u)).then(function(r){return r.json();}).then(function(d){
      const items=(d.items||[]).map(function(it){
        return {
          title:(it.title||'').replace(/<!\[CDATA\[|\]\]>/g,'').trim(),
          desc:((it.description||'').replace(/<[^>]*>/g,'').replace(/<!\[CDATA\[|\]\]>/g,'')).slice(0,220),
          url:it.link,
          pubDate:it.pubDate,
          en:it.enclosure&&it.enclosure.link?it.enclosure.link:null,
          source:f.b,
          c:f.c
        };
      });
      return items;
    }).catch(function(){return [];});
  }));
  let all=[];
  results.forEach(function(r){if(r.status==='fulfilled')all=all.concat(r.value);});
  all=all.filter(function(a){return a.title&&a.url;});
  all.sort(function(a,b){return new Date(b.pubDate)-new Date(a.pubDate);});
  let seen={},uniq=[];
  for(const a of all){if(!seen[a.title]){seen[a.title]=1;uniq.push(a);}}
  state.articles=uniq.slice(0,200);
  state.filtered=[...state.articles];
  state.page=1;
  renderNewsGrid();renderHero();renderTicker();renderLocalNews();
  const lw=document.getElementById('loadMoreWrap');
  if(lw)lw.style.display='block';
  if(state.refreshTimer)clearInterval(state.refreshTimer);
  state.refreshTimer=setInterval(function(){loadNews().catch(function(){});},REFRESH_INTERVAL);
}

// ── SEARCH ──
var searchTimer=null;
function onSearchDebounced(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(applySearch,300);
}
function applySearch(){
  const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  state.searchText=q;
  if(!q){
    state.filtered=[...state.articles];
    state.searchAll=[];
    state.page=1;
    renderNewsGrid();renderHero();renderTicker();renderLocalNews();
    return;
  }
  const terms=q.split(/\s+/);
  const matches=function(m){return terms.every(function(term){return (m||'').toLowerCase().includes(term);});};
  state.searchAll=state.articles.filter(function(a){return matches(a.title)||matches(a.desc);});
  state.page=1;
  renderNewsGrid();renderHero();renderTicker();renderLocalNews();
}

// ── INIT ──
(async function init(){
  document.documentElement.setAttribute('data-theme',state.theme);
  const tb=document.getElementById('themeToggle');
  if(tb)tb.textContent=state.theme==='dark'?'🌙':'☀️';
  document.getElementById('searchInput').addEventListener('input',onSearchDebounced);
  initVisitorCounter();initBackToTop();updateFooterTime();setInterval(updateFooterTime,60000);
  detectLocation().then(function(loc){
    if(loc){
      state.userCountry=loc.countryCode;
      state.userCountryName=loc.countryName||loc.countryCode;
      state.userLat=loc.lat||0;
      state.userLon=loc.lon||0;
      const hf=document.getElementById('hdrFlag');
      if(hf)hf.textContent=FLAGS[loc.countryCode]||'🌍';
      const hc=document.getElementById('hdrCountry');
      if(hc)hc.textContent=loc.countryCode;
      const lf=document.getElementById('localFlag');
      if(lf)lf.textContent=FLAGS[loc.countryCode]||'🌍';
      const lc=document.getElementById('localCountryName');
      if(lc)lc.textContent=loc.countryName||loc.countryCode;
      const city=document.getElementById('localCity');
      if(city)city.textContent=loc.city||'';
      loadWeather();
    }else{
      const lf=document.getElementById('localFlag');
      if(lf)lf.textContent='🌍';
      const lc=document.getElementById('localCountryName');
      if(lc)lc.textContent='Worldwide';
    }
  });
  const detected=await detectLanguage();
  applyLocalization(detected);
  await loadNews();
})();
</script>
