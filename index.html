/* ═══ IP + COUNTRY ═══ */
async function detectIP(){
  const apis=[
    ()=>fetch('https://ipapi.co/json/').then(r=>r.ok?r.json():null),
    ()=>fetch('https://ipwho.is/').then(r=>r.ok?r.json():null),
    ()=>fetch('https://ipinfo.io/json').then(r=>r.ok?r.json():null)
  ];
  const results=await Promise.allSettled(apis.map(fn=>fn().catch(()=>null)));
  for(const r of results){
    if(r.status==='fulfilled'&&r.value){
      const d=r.value;
      const cc=d.country_code||d.country;
      const cn=d.country_name||d.country||d.city;
      if(cc&&cc.length===2){
        userCountry=cc;
        if(d.latitude)userLat=d.latitude;
        if(d.longitude)userLon=d.longitude;
        document.getElementById('hdrFlag').textContent=FLAGS_CC[cc]||'🌍';
        if(cn)document.getElementById('hdrFlag').title=cn;
        if(COUNTRY_LANG[cc]){const s=localStorage.getItem('buzznow_lang');if(!s)localStorage.setItem('buzznow_lang',COUNTRY_LANG[cc])}
        break;
      }
    }
  }
}

    const d=await fetch(url).then(r=>r.json());

    const wMO={'0':'☀️','1':'🌤','2':'⛅','3':'☁️','45':'🌫','48':'🌫','51':'🌦','53':'🌦','55':'🌧','61':'🌧','63':'🌧','65':'🌧','71':'🌨','73':'🌨','75':'🌨','80':'🌦','81':'🌧','82':'⛈','95':'⛈','96':'⛈','99':'⛈'};

  isDark=!isDark;
  if(isDark){document.documentElement.style.cssText='';document.body.style.cssText='background:var(--bg);color:var(--text)';document.getElementById('themeBtn').textContent='🌙'}
  else{document.documentElement.style.cssText='--bg:#f5f5fa;--surface:#fff;--surface2:#e8e8f0;--text:#1a1a2e;--text-muted:#6b7280;--border:#d1d5db';document.body.style.cssText='background:#f5f5fa;color:#1a1a2e';document.getElementById('themeBtn').textContent='☀️'}
}

/* ═══ HELPERS ═══ */
function ago(d){const t=I18N[curLang]||I18N.en;const s=Math.floor((Date.now()-d.getTime())/1000);if(s<60)return t.justNow||'now';if(s<3600)return Math.floor(s/60)+(t.m||'m');if(s<86400)return Math.floor(s/3600)+(t.h||'h');return Math.floor(s/86400)+(t.d||'d')}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function manualRefresh(){const b=document.getElementById('refreshBtn');b.style.transform='rotate(360deg)';b.style.transition='transform .8s';clearTimeout(refreshT);await loadNews();b.style.transform='';startAuto()}
function startAuto(){refreshT=setTimeout(async()=>{await loadNews();startAuto()},REFRESH)}

/* ═══ RESPONSIVE ═══ */
function checkMobile(){
  const hs=document.getElementById('heroSection');
  const mn=document.getElementById('mobileNav');
  if(window.innerWidth<=900){hs.style.gridTemplateColumns='1fr';mn.style.display='flex'}
  else{hs.style.gridTemplateColumns='2fr 1fr';mn.style.display='none'}
}
window.addEventListener('resize',checkMobile);

/* ═══ INIT ═══ */
(async()=>{
  const saved=localStorage.getItem('buzznow_lang');if(saved&&I18N[saved])curLang=saved;
  applyLang(curLang);checkMobile();
  Promise.all([detectIP(),loadNews(),loadWeather()]);
})();
</script>
</body>
